name: Build Windows Installer

on:
  push:
    tags:
      - 'v*'        # Trigger khi push tag như: v2.0.0
  workflow_dispatch: # Cho phép chạy thủ công trên GitHub Actions

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows Installer (NSIS + Portable)
        run: npm run build:all
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List release files
        run: dir release\

      - name: Upload NSIS Installer
        uses: actions/upload-artifact@v4
        with:
          name: HardwareInspector-Setup
          path: release/*Setup*.exe
          retention-days: 90

      - name: Upload Portable
        uses: actions/upload-artifact@v4
        with:
          name: HardwareInspector-Portable
          path: release/*Portable*.exe
          retention-days: 90

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*Setup*.exe
            release/*Portable*.exe
          name: "Hardware Inspector ${{ github.ref_name }}"
          body: |
            ## 🖥️ Hardware Inspector ${{ github.ref_name }}
            **by AliStudio Lab**
            
            ### 📥 Tải về
            | File | Mô tả |
            |------|-------|
            | `*Setup*.exe` | Cài đặt đầy đủ (khuyến nghị) — có wizard, tạo shortcut |
            | `*Portable*.exe` | Portable — chạy thẳng, không cần cài |
            
            ### 🚀 Cài từ GitHub (tự động)
            ```powershell
            irm https://raw.githubusercontent.com/${{ github.repository }}/main/install.ps1 | iex
            ```
            
            ### Tính năng
            - 📊 Giám sát CPU, RAM, GPU realtime
            - 🌡️ Nhiệt độ CPU với cảnh báo màu sắc
            - 🌐 Theo dõi tốc độ mạng realtime
            - 💿 Kiểm tra sức khỏe ổ cứng S.M.A.R.T
            - 🔥 Stress Test & CPU Benchmark
            - 📋 Copy nhanh thông số vào clipboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
